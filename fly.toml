# fly.toml — VIPBOT · Fly.io deployment
# Owned & Developed by Lupin Stanley
# Docs: https://fly.io/docs/reference/configuration/
#
# ─── DEPLOY STEPS (first time only) ────────────────────────────────────────────
#  1. Install flyctl -> https://fly.io/docs/hands-on/install-flyctl/
#  2. fly auth login
#  3. fly launch --no-deploy
#  4. Create persistent volumes (session + database survive restarts):
#       fly vol create vipbot_data    --size 1 --region lad
#       fly vol create vipbot_session --size 1 --region lad
#  5. Set secrets:
#       fly secrets set SESSION_ID="VIPBOT:your-session-string-here"
#       fly secrets set DATABASE_URL="postgres://user:pass@host:5432/db?sslmode=require"
#  6. fly deploy
# ────────────────────────────────────────────────────────────────────────────────

app            = 'vipbot'
primary_region = 'lad'
kill_signal    = 'SIGINT'
kill_timeout   = '30s'

[build]

[env]
  NODE_ENV = 'production'
  PORT     = '3000'

  # Bot identity
  OWNER_NAME   = 'Lupin Stanley'
  OWNER_NUMBER = '255780470905'
  BOT_NAME     = 'VIPBOT'
  BOT_PREFIX   = '.'
  BOT_MODE     = 'public'
  BOT_TIMEZONE = 'UTC'

  # Optional integrations
  PTERODACTYL_KEY = ''
  PTERODACTYL_URL = ''
  PAYSTACK_KEY    = ''
  APIX_API_KEY    = ''
  TELEGRAM_BOT_TOKEN = ''

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ['app']

  [[http_service.checks]]
    interval     = '30s'
    timeout      = '10s'
    grace_period = '45s'
    method       = 'GET'
    path         = '/health'

[[mounts]]
  source      = 'vipbot_data'
  destination = '/app/data'

[[mounts]]
  source      = 'vipbot_session'
  destination = '/app/session'

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '1gb'
